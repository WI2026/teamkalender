<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; manifest-src 'self'; connect-src https://opdcnhydkdeesstvhonv.supabase.co wss://opdcnhydkdeesstvhonv.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Teamkalender">
<meta name="theme-color" content="#e9eef6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
<title>PentaWerk Teamkalender</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script src="vendor/supabase.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<script src="bg-szene.js" defer></script>
<script src="bg.js" defer></script>
</head>
<body class="locked">
<div class="login" id="login">
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-brand" aria-hidden="true">
      <img class="mark" src="mark.svg" alt="" width="72" height="70">
      <span class="wordmark"></span>
      <span class="claim">Plan &amp; Handwerk aus einer Hand</span>
    </div>
    <h1><span class="sr">PentaWerk </span>Teamkalender</h1>
    <p>Bitte das Team-Passwort eingeben.</p>
    <label class="sr" for="loginPw">Passwort</label>
    <input type="password" id="loginPw" autocomplete="current-password" placeholder="Passwort">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn primary" id="loginBtn" type="submit">Öffnen</button>
    <p class="login-foot">PentaWerk ist eine Marke der Wattcon Installation UG</p>
  </form>
</div>

<div class="app">
  <div class="top">
    <div class="brand">
      <img class="mark" src="mark.svg" alt="" width="34" height="33">
      <div class="brand-text">
        <span class="wordmark" role="img" aria-label="PentaWerk"></span>
        <div class="brand-sub">
          <h1><span class="sr">PentaWerk </span>Teamkalender</h1>
          <span class="status" id="status" data-state="loading"><i></i><span id="statusText">Verbinde …</span></span>
        </div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost logout" id="logoutBtn" type="button">Abmelden</button>
    <button class="btn primary" id="newBtn" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      Neuer Termin
    </button>
  </div>

  <div class="banner" id="banner" hidden>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v3.8M8 5v.1"/></svg>
    <span id="bannerText"></span>
  </div>

  <div class="toolbar">
    <div class="period">
      <h2 id="periodTitle">Oktober 2026</h2>
      <span class="kw num" id="periodKw"></span>
    </div>
    <select class="filter" id="personFilter" aria-label="Nach Person filtern"><option value="">Alle Personen</option></select>
    <div class="seg" role="group" aria-label="Ansicht">
      <button type="button" data-view="month" aria-pressed="true">Monat</button>
      <button type="button" data-view="week" aria-pressed="false">Woche</button>
    </div>
    <div class="nav">
      <button class="btn icon" id="prevBtn" type="button" aria-label="Zurück"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8 10 12.5"/></svg></button>
      <button class="btn" id="todayBtn" type="button">Heute</button>
      <button class="btn icon" id="nextBtn" type="button" aria-label="Weiter"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></button>
    </div>
  </div>

  <div class="main">
    <div class="board" id="board"></div>
    <aside class="agenda" id="agenda" aria-live="polite"></aside>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form" method="dialog" novalidate>
    <h4 id="dlgTitle">Neuer Termin</h4>
    <div class="field">
      <label for="f-title">Titel</label>
      <input type="text" id="f-title" maxlength="120" placeholder="z. B. Zählerschrank Musterstraße 4" autocomplete="off">
    </div>
    <div class="field">
      <span class="lbl" id="catLbl">Art</span>
      <div class="cats" role="radiogroup" aria-labelledby="catLbl" id="cats"></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="f-date">Datum</label>
        <input type="date" id="f-date">
      </div>
      <div class="field" style="align-content:end">
        <label class="toggle" for="f-allday"><input type="checkbox" id="f-allday"> Ganztägig</label>
      </div>
    </div>
    <div class="row" id="timeRow">
      <div class="field">
        <label for="f-start">Von</label>
        <input type="time" id="f-start" step="900" value="08:00">
      </div>
      <div class="field">
        <label for="f-end">Bis</label>
        <input type="time" id="f-end" step="900" value="09:00">
      </div>
    </div>
    <div class="field">
      <label for="f-person">Eingetragen von</label>
      <input type="text" id="f-person" maxlength="60" placeholder="Dein Name" autocomplete="name">
    </div>
    <div class="field">
      <label for="f-note">Notiz <span style="font-weight:400;color:var(--fg-3)">(optional)</span></label>
      <textarea id="f-note" maxlength="1000" placeholder="Adresse, Ansprechpartner, Material …"></textarea>
    </div>
    <div class="err" id="formErr" role="alert"></div>
    <div class="actions">
      <button class="btn danger" type="button" id="delBtn" hidden>Löschen</button>
      <span class="stamp" id="stamp"></span>
      <span class="spacer"></span>
      <button class="btn ghost" type="button" id="cancelBtn">Abbrechen</button>
      <button class="btn primary" type="submit" id="saveBtn">Speichern</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden role="status"></div>

<canvas id="bgfx" aria-hidden="true"></canvas>
<canvas id="bg3d" aria-hidden="true"></canvas>
</body>
</html>
